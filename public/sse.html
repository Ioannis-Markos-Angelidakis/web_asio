<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>fw Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23007AFF'/%3E%3Cpath d='M16 7c-5.5 0-10 3.5-10 7.9 0 2.5 1.5 4.7 3.8 6.1-.3 1.4-1.1 2.6-2.2 3.5 1.9-.2 3.6-.9 5-2 1.1.3 2.2.5 3.4.5 5.5 0 10-3.5 10-7.9S21.5 7 16 7z' fill='white'/%3E%3C/svg%3E">
<style>
/* ============================================================
   fw Chat — Apple Human Interface Guidelines inspired client
   ============================================================ */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
  --purple:#AF52DE; --teal:#30B0C7; --indigo:#5856D6; --pink:#FF2D55; --gray:#8E8E93;
  --bg:#F2F2F7; --canvas:#FFFFFF; --elevated:#FFFFFF;
  --sidebar:rgba(246,246,248,.82); --bar:rgba(255,255,255,.78);
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2); --fill3:rgba(120,120,128,.32);
  --sep:rgba(60,60,67,.16); --sep-strong:rgba(60,60,67,.29);
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
  --bubble-in:#E9E9EB; --bubble-out:#007AFF; --on-blue:#fff;
  --scrim:rgba(0,0,0,.26); --sheet:rgba(250,250,252,.86);
  --shadow-s:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.07);
  --shadow-l:0 12px 44px rgba(0,0,0,.20),0 2px 8px rgba(0,0,0,.08);
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
html[data-theme="dark"]{
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
  --purple:#BF5AF2; --teal:#40C8E0; --indigo:#5E5CE6; --pink:#FF375F; --gray:#8E8E93;
  --bg:#000000; --canvas:#000000; --elevated:#1C1C1E;
  --sidebar:rgba(28,28,30,.78); --bar:rgba(28,28,30,.76);
  --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.34); --fill3:rgba(120,120,128,.46);
  --sep:rgba(84,84,88,.55); --sep-strong:rgba(84,84,88,.75);
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --bubble-in:#2C2C2E; --bubble-out:#0A84FF;
  --scrim:rgba(0,0,0,.55); --sheet:rgba(38,38,40,.86);
  --shadow-s:0 1px 2px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.4);
  --shadow-l:0 16px 50px rgba(0,0,0,.66);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--label);font-size:16px;line-height:1.35;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:2px;border-radius:8px}
::selection{background:color-mix(in srgb,var(--blue) 26%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--fill3) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--fill3);border-radius:99px;border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--gray);background-clip:content-box}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 20px;
  border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:590;letter-spacing:-.01em;
  transition:filter .15s,transform .12s var(--ease),opacity .15s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.975)}
.btn:disabled{opacity:.38;cursor:default}
.btn.secondary{background:var(--fill);color:var(--blue)}
.btn.plain{background:transparent;color:var(--blue)}
.btn.destructive{background:var(--red);color:#fff}
.btn.sm{height:32px;padding:0 13px;font-size:14px;border-radius:9px;font-weight:510}
.tool{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;
  color:var(--blue);transition:background .15s,transform .12s var(--ease)}
.tool:hover{background:var(--fill)}
.tool:active{transform:scale(.94)}
.tool.muted{color:var(--label2)}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;
  font-weight:600;letter-spacing:-.02em;flex:none;width:40px;height:40px;font-size:15px;user-select:none}
.avatar.s{width:28px;height:28px;font-size:11.5px}
.avatar.l{width:64px;height:64px;font-size:24px}
.avatar.xl{width:80px;height:80px;font-size:30px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--blue);color:#fff;
  font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.presence{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 2px var(--canvas)}
.presence.off{background:var(--gray)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--fill3);border-top-color:var(--blue);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes bubbleIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bannerIn{from{opacity:0;transform:translateY(-16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

/* ---------- onboarding ---------- */
.onboarding{position:fixed;inset:0;display:grid;place-items:center;padding:24px;overflow-y:auto;
  background:radial-gradient(1100px 620px at 50% -10%,color-mix(in srgb,var(--blue) 9%,var(--bg)),var(--bg) 62%)}
.join-card{width:min(400px,100%);background:var(--elevated);border-radius:22px;padding:34px 30px 26px;
  box-shadow:var(--shadow-l);text-align:center;animation:popIn .4s var(--ease) both;border:.5px solid var(--sep)}
.app-icon{width:76px;height:76px;border-radius:19px;margin:0 auto 18px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,#3aa0ff,var(--blue) 46%,var(--indigo));box-shadow:0 8px 22px rgba(0,122,255,.34)}
.app-icon .ic{width:42px;height:42px}
.join-card h1{font-size:28px;font-weight:700;letter-spacing:-.022em}
.join-card .sub{margin-top:7px;font-size:15px;color:var(--label2);line-height:1.45;letter-spacing:-.01em}
.field{margin-top:24px;text-align:left}
.field label{display:block;font-size:12px;font-weight:590;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;margin:0 0 7px 3px}
.text-input{width:100%;height:46px;border-radius:11px;border:.5px solid var(--sep-strong);background:var(--fill);
  padding:0 14px;font-size:16px;letter-spacing:-.01em;transition:border-color .15s,box-shadow .15s,background .15s}
.text-input::placeholder{color:var(--label3)}
.text-input:focus{outline:none;background:var(--canvas);border-color:var(--blue);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 22%,transparent)}
.join-error{display:flex;gap:7px;align-items:flex-start;margin-top:11px;color:var(--red);font-size:13.5px;text-align:left;line-height:1.4}
.join-error .ic{width:16px;height:16px;margin-top:1px}
#joinBtn{width:100%;margin-top:18px;height:48px}
.join-divider{height:.5px;background:var(--sep);margin:24px 0 16px}
.join-online-title{font-size:12px;font-weight:590;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;text-align:left;margin-bottom:10px}
.join-people{display:flex;flex-wrap:wrap;gap:7px;max-height:96px;overflow-y:auto}
.person-chip{display:inline-flex;align-items:center;gap:6px;background:var(--fill);border-radius:99px;padding:4px 11px 4px 4px;font-size:13px;color:var(--label);letter-spacing:-.01em}
.join-empty{font-size:13.5px;color:var(--label2)}
.join-foot{margin-top:20px;font-size:11.5px;color:var(--label3);font-family:var(--mono);letter-spacing:-.01em}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:320px 1fr;height:100dvh;background:var(--canvas);transition:grid-template-columns .3s var(--ease)}
.app.collapsed{grid-template-columns:0 1fr}
.sidebar{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--sidebar);
  backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border-right:.5px solid var(--sep);overflow:hidden}
.sidebar-top{padding:14px 16px 10px;flex:none}
.sidebar-title{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:700;letter-spacing:-.022em;margin-bottom:12px}
.sidebar-title .tool{margin-left:auto}
.search{display:flex;align-items:center;gap:7px;height:36px;border-radius:10px;background:var(--fill);padding:0 9px}
.search .ic{width:16px;height:16px;color:var(--label2)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px;letter-spacing:-.01em}
.search input::placeholder{color:var(--label3)}
.search .clear{color:var(--label3);display:inline-flex}
.search .clear .ic{width:16px;height:16px}
.sidebar-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 10px 12px}
.section-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--label2);
  text-transform:uppercase;letter-spacing:.045em;padding:14px 8px 7px}
.section-title span{color:var(--label3);font-weight:500}
.chat-row,.person-row{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:11px;
  text-align:left;transition:background .13s;position:relative}
.chat-row:hover,.person-row:hover{background:var(--fill)}
.chat-row.active{background:var(--blue);color:#fff}
.chat-row.active .chat-preview,.chat-row.active .chat-time,.chat-row.active .chat-name{color:#fff}
.chat-row.active .badge{background:#fff;color:var(--blue)}
.chat-main{flex:1;min-width:0}
.chat-name{font-size:15px;font-weight:590;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chat-name .ic{width:12px;height:12px;color:var(--purple)}
.chat-row.active .chat-name .ic{color:#fff}
.chat-preview{font-size:13px;color:var(--label2);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.chat-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.chat-time{font-size:11.5px;color:var(--label3);font-variant-numeric:tabular-nums}
.person-row{padding:7px 10px}
.person-name{flex:1;min-width:0;font-size:15px;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-row .chev{color:var(--label3);opacity:0;transition:opacity .13s}
.person-row:hover .chev{opacity:1}
.person-row .chev .ic{width:15px;height:15px}
.list-empty{font-size:13px;color:var(--label3);padding:4px 10px 8px;letter-spacing:-.01em}
.sidebar-foot{flex:none;display:flex;align-items:center;gap:10px;padding:11px 14px calc(11px + env(safe-area-inset-bottom));border-top:.5px solid var(--sep)}
.self-meta{flex:1;min-width:0}
.self-name{font-size:14px;font-weight:590;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--label2);letter-spacing:-.01em}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--gray)}
.conn-dot.live{background:var(--green)}
.conn-dot.wait{background:var(--orange);animation:blink 1.1s ease-in-out infinite}
.conn-dot.off{background:var(--red)}
@keyframes blink{50%{opacity:.35}}
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .28s var(--ease);z-index:40}

/* ---------- content ---------- */
.content{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas)}
.toolbar{flex:none;display:flex;align-items:center;gap:11px;height:58px;padding:0 14px;
  background:var(--bar);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border-bottom:.5px solid var(--sep);z-index:12}
.toolbar-title{flex:1;min-width:0}
#convTitle{font-size:16.5px;font-weight:640;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#convSub{font-size:12.5px;color:var(--label2);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.toolbar-actions{display:flex;align-items:center;gap:2px}
.conv-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--label2);flex:none}
.conv-icon .ic{width:19px;height:19px}
.conn-bar{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;height:32px;font-size:12.5px;
  color:var(--label2);background:color-mix(in srgb,var(--orange) 13%,var(--canvas));border-bottom:.5px solid var(--sep);letter-spacing:-.01em}
.messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 18px 8px}
.msg-inner{max-width:860px;margin:0 auto;display:flex;flex-direction:column}
.day-divider{text-align:center;font-size:11.5px;color:var(--label3);letter-spacing:-.005em;padding:14px 0 10px}
.day-divider b{font-weight:600;color:var(--label2)}
.sys-note{text-align:center;font-size:12.5px;color:var(--label2);padding:6px 24px;letter-spacing:-.01em;line-height:1.4}
.row{display:flex;align-items:flex-end;gap:7px;margin-top:2px}
.row.first{margin-top:9px}
.row.mine{flex-direction:row-reverse}
.avatar-slot{width:28px;flex:none;visibility:hidden}
.row.theirs.last .avatar-slot{visibility:visible}
.row.mine .avatar-slot{display:none}
.stack{display:flex;flex-direction:column;min-width:0;max-width:100%;align-items:flex-start}
.row.mine .stack{align-items:flex-end}
.sender-name{font-size:11.5px;color:var(--label2);margin:0 0 3px 13px;letter-spacing:-.005em;display:none}
.row.theirs.first .sender-name{display:block}
.row.dm .sender-name{display:none!important}
.bubble{position:relative;max-width:min(560px,72vw);padding:8.5px 14px;border-radius:19px;background:var(--bubble-in);
  color:var(--label);font-size:16px;line-height:1.36;letter-spacing:-.012em;white-space:pre-wrap;
  overflow-wrap:anywhere;word-break:break-word}
.row.mine .bubble{background:var(--bubble-out);color:var(--on-blue)}
.row.theirs.last .bubble{border-bottom-left-radius:6px}
.row.mine.last .bubble{border-bottom-right-radius:6px}
.row.enter .bubble,.row.enter .bubble-media{animation:bubbleIn .26s var(--ease) both}
.bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.row.theirs .bubble a{color:var(--blue)}
.bubble-media{position:relative;max-width:min(300px,68vw);border-radius:19px;overflow:hidden;background:var(--fill);
  box-shadow:inset 0 0 0 .5px var(--sep-strong);line-height:0}
.row.theirs.last .bubble-media{border-bottom-left-radius:6px}
.row.mine.last .bubble-media{border-bottom-right-radius:6px}
.bubble-media img{display:block;width:100%;height:auto;max-height:340px;object-fit:cover;cursor:pointer;
  transition:transform .2s var(--ease),filter .2s}
.bubble-media img:hover{transform:scale(1.015)}
.bubble-media.uploading img{filter:brightness(.62)}
.upload-ring{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.upload-ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.upload-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.upload-ring .bg{stroke:rgba(255,255,255,.32)}
.upload-ring .fg{stroke:#fff;stroke-dasharray:94.25;stroke-dashoffset:94.25;transition:stroke-dashoffset .18s linear}
.file-card{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:16px;background:var(--fill);
  min-width:min(268px,70vw);max-width:min(320px,74vw);box-shadow:inset 0 0 0 .5px var(--sep)}
.row.mine .file-card{background:color-mix(in srgb,var(--blue) 16%,var(--canvas))}
.file-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--indigo);color:#fff;flex:none}
.file-icon .ic{width:20px;height:20px}
.file-meta{flex:1;min-width:0}
.file-name{font-size:14px;font-weight:540;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-sub{font-size:11.5px;color:var(--label2);margin-top:1px}
.file-dl{color:var(--blue);display:inline-flex;flex:none}
.file-dl .ic{width:24px;height:24px}
.msg-status{font-size:11px;color:var(--label2);margin:3px 4px 0;letter-spacing:-.005em;display:flex;align-items:center;gap:5px;min-height:14px}
.msg-status.failed{color:var(--red);font-weight:510}
.msg-status button{color:var(--blue);font-size:11px;font-weight:590;text-decoration:underline}
.row-actions{display:flex;align-items:center;opacity:0;transition:opacity .14s;flex:none}
.row:hover .row-actions{opacity:1}
.row-actions .tool{width:28px;height:28px;color:var(--label3)}
.row-actions .ic{width:15px;height:15px}
.empty-state{margin:auto;text-align:center;padding:40px 24px;max-width:340px;animation:fadeUp .35s var(--ease) both}
.empty-icon{width:60px;height:60px;border-radius:50%;background:var(--fill);display:grid;place-items:center;margin:0 auto 14px;color:var(--label3)}
.empty-icon .ic{width:28px;height:28px}
.empty-state h3{font-size:19px;font-weight:640;letter-spacing:-.02em}
.empty-state p{font-size:14px;color:var(--label2);margin-top:6px;line-height:1.45;letter-spacing:-.01em}
.jump{position:absolute;right:20px;bottom:104px;z-index:11;display:inline-flex;align-items:center;gap:6px;height:34px;
  padding:0 13px;border-radius:99px;background:var(--elevated);color:var(--blue);font-size:13px;font-weight:590;
  box-shadow:var(--shadow-s);border:.5px solid var(--sep);animation:popIn .2s var(--ease) both}
.jump .ic{width:15px;height:15px}
.conv-banner{flex:none;display:flex;align-items:center;gap:10px;margin:0 16px 8px;padding:11px 14px;border-radius:13px;
  background:var(--fill);font-size:13.5px;color:var(--label2);letter-spacing:-.01em}
.conv-banner .ic{width:17px;height:17px;color:var(--purple)}
.conv-banner .txt{flex:1;min-width:0}
.drop-hint{position:absolute;inset:0;z-index:25;display:grid;place-items:center;background:color-mix(in srgb,var(--canvas) 78%,transparent);
  backdrop-filter:blur(8px);pointer-events:none}
.drop-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 46px;border-radius:20px;
  border:2px dashed var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--elevated));color:var(--blue)}
.drop-card .ic{width:34px;height:34px}
.drop-card h3{font-size:18px;font-weight:640;letter-spacing:-.02em;color:var(--label)}
.drop-card p{font-size:13px;color:var(--label2)}

/* ---------- composer ---------- */
.composer{flex:none;display:flex;align-items:flex-end;gap:9px;padding:9px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--bar);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border-top:.5px solid var(--sep)}
.compose-inner{display:flex;align-items:flex-end;gap:9px;max-width:860px;margin:0 auto;width:100%}
.plus-btn{width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--label2);display:grid;place-items:center;
  flex:none;margin-bottom:2px;transition:background .15s,transform .12s var(--ease)}
.plus-btn:hover:not(:disabled){background:var(--fill2)}
.plus-btn:active:not(:disabled){transform:scale(.93)}
.plus-btn:disabled{opacity:.4}
.plus-btn .ic{width:19px;height:19px}
.compose-field{flex:1;min-width:0;display:flex;align-items:flex-end;gap:6px;border-radius:19px;border:.5px solid var(--sep-strong);

const Audio_ = {
  ctx: null, bus: null,
  init(){
    if (this.ctx) { this.ctx.resume && this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC(); this.bus = this.ctx.createGain(); this.bus.gain.value = .8; this.bus.connect(this.ctx.destination); } catch {}
  },
  note(f, dur, o = {}){
    if (!this.ctx) return;

    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.gain || .05, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(g); g.connect(this.bus); osc.start(t); osc.stop(t + dur + .04);
  },
  play(kind){
    if (!St.sound || !this.ctx) return;
    const now = performance.now(), gap = { receive: 900, sent: 120, request: 1200, error: 900, join: 2500 }[kind] || 300;
    if (now - (St.lastSound[kind] || 0) < gap) return; St.lastSound[kind] = now;
    if (kind === 'receive') { this.note(1046.5, .1, { gain: .045 }); this.note(1396.9, .16, { gain: .04, at: .075 }); }
    else if (kind === 'sent') this.note(720, .13, { gain: .035, to: 1250, type: 'triangle' });
    else if (kind === 'request') [784, 987.8, 1174.7].forEach((f, i) => this.note(f, .2, { gain: .04, at: i * .085 }));
    else if (kind === 'error') this.note(320, .18, { gain: .045, to: 220 });
    else if (kind === 'join') this.note(880, .09, { gain: .025 });
  }
};

function linkify(node, text){

    const a = el('a', null, m[1]); a.href = m[1]; a.target = '_blank'; a.rel = 'noopener noreferrer';
    node.appendChild(a); last = m.index + m[1].length;

}

    if (stage === 0 && remote) { stage = 1; img.src = remote; return; }
    if (stage <= 1 && remote) { stage = 2; img.src = '/view-image/' + encodeURIComponent(baseName(remote)); return; }
    wrap.replaceWith(fileNode(m));

function fileNode(m){
  const card = el('div', 'file-card');
  const ic = el('span', 'file-icon'); ic.appendChild(icon(isRaster(m.filename) || isSvg(m.filename) ? 'photo' : 'doc'));
  card.appendChild(ic);
  const meta = el('div', 'file-meta');
  meta.appendChild(el('div', 'file-name', m.filename || baseName(m.url)));
  meta.appendChild(el('div', 'file-sub', m.status === 'uploading' ? `Uploading ${Math.round((m.progress || 0) * 100)}%` : (isSvg(m.filename) ? 'SVG image' : 'File')));
  card.appendChild(meta);
  m._fileSub = meta.lastChild;
  if (m.url) { const a = el('a', 'file-dl'); a.href = dlHref(m.url); a.setAttribute('download', ''); a.title = 'Download'; a.appendChild(icon('download')); card.appendChild(a); }
  return card;
}
function setProgress(m, p){
  m.progress = p;
  if (m._ring) m._ring.style.strokeDashoffset = String(94.25 * (1 - p));
  if (m._fileSub) m._fileSub.textContent = `Uploading ${Math.round(p * 100)}%`;
}
function statusNode(m){
  const s = el('div', 'msg-status');
  m._status = s; paintStatus(m); return s;
}
function paintStatus(m){
  if (!m._status) return;
  const s = m._status; s.textContent = ''; s.className = 'msg-status';
  if (!m.mine) { s.style.display = 'none'; return; }
  if (!m._isLast) { s.style.display = 'none'; return; }
  s.style.display = 'flex';
  if (m.status === 'uploading') s.appendChild(el('span', null, `Uploading ${Math.round((m.progress || 0) * 100)}%`));
  else if (m.status === 'sending') s.appendChild(el('span', null, 'Sending…'));
  else if (m.status === 'sent') s.appendChild(el('span', null, 'Sent'));
  else if (m.status === 'failed') {
    s.classList.add('failed'); s.appendChild(el('span', null, 'Not Delivered'));
    const b = el('button', null, 'Try Again'); b.type = 'button'; b.onclick = () => retry(m); s.appendChild(b);
  } else s.appendChild(el('span', null, 'Delivered'));
}
function buildRow(m, flags){
  if (m.kind === 'system') {
    const n = el('div', 'sys-note', m.text); m._node = n; return n;
  }
  const row = el('div', 'row ' + (m.mine ? 'mine' : 'theirs') + (flags.first ? ' first' : '') + (flags.last ? ' last' : '') + (m.dm ? ' dm' : ''));
  const slot = el('div', 'avatar-slot'); if (!m.mine) slot.appendChild(avatar(m.from, 's')); row.appendChild(slot);
  const stack = el('div', 'stack');
  if (!m.mine) stack.appendChild(el('div', 'sender-name', m.from));
  if (m.kind === 'file') stack.appendChild(m.isImage ? mediaNode(m) : fileNode(m));
  else { const b = el('div', 'bubble'); linkify(b, m.text); stack.appendChild(b); }
  m._isLast = flags.last;
  stack.appendChild(statusNode(m));
  row.appendChild(stack);
  const acts = el('div', 'row-actions');
  const cp = el('button', 'tool'); cp.type = 'button'; cp.title = 'Copy'; cp.appendChild(icon('copy'));
  cp.onclick = () => copy(m.kind === 'file' ? location.origin + (m.url || '') : m.text);
  acts.appendChild(cp); row.appendChild(acts);
  m._node = row;
  return row;
}
function flagsFor(arr, i){
  const m = arr[i], p = arr[i - 1], n = arr[i + 1];
  const same = (a, b) => !!a && !!b && a.kind !== 'system' && b.kind !== 'system' && a.from === b.from && a.mine === b.mine && Math.abs(a.ts - b.ts) < 300000;
  return { first: !same(p, m), last: !same(m, n) };
}
function needDivider(prev, m){
  if (!prev) return true;
  if (new Date(prev.ts).toDateString() !== new Date(m.ts).toDateString()) return true;
  return m.ts - prev.ts > 15 * 60 * 1000;
}
function dividerNode(m){
  const d = el('div', 'day-divider');
  d.appendChild(el('b', null, dayLabel(m.ts) + ' '));
  d.appendChild(document.createTextNode(timeOf(m.ts)));
  return d;
}
function appendRow(m, animate){
  const t = thread(m.thread);
  const i = t.msgs.length - 1, prev = t.msgs[i - 1];
  if (needDivider(prev, m)) D.msgInner.appendChild(dividerNode(m));
  const flags = flagsFor(t.msgs, i);
  if (prev && prev._node && !flags.first && prev.kind !== 'system') {
    prev._node.classList.remove('last'); prev._isLast = false; paintStatus(prev);
  }
  if (St.emptyNode) { St.emptyNode.remove(); St.emptyNode = null; }
  const node = buildRow(m, flags);
  if (animate) node.classList.add('enter');
  D.msgInner.appendChild(node);
}
function renderThread(){
  const t = activeThread();
  D.msgInner.textContent = ''; St.emptyNode = null;
  let prev = null;
  t.msgs.forEach((m, i) => {
    if (needDivider(prev, m)) D.msgInner.appendChild(dividerNode(m));
    const node = buildRow(m, flagsFor(t.msgs, i));
    D.msgInner.appendChild(node);
    prev = m;
  });
  renderEmpty();
  scrollToBottom(false);
}
function renderEmpty(){
  if (St.emptyNode) { St.emptyNode.remove(); St.emptyNode = null; }
  const t = activeThread();
  if (t.msgs.some(m => m.kind !== 'system')) return;
  const box = el('div', 'empty-state');
  const ic = el('div', 'empty-icon'); ic.appendChild(icon(t.dm ? 'lock' : 'bubbles')); box.appendChild(ic);
  box.appendChild(el('h3', null, t.dm ? 'Private Conversation' : 'No Messages Yet'));
  box.appendChild(el('p', null, t.dm
    ? (t.status === 'active' ? `Messages here are delivered only to you and ${t.name}.` : `Send a request to start a private conversation with ${t.name}.`)
    : 'Say hello — everyone online will see your message.'));
  D.msgInner.appendChild(box); St.emptyNode = box;
}
function atBottom(){ return D.messages.scrollHeight - D.messages.scrollTop - D.messages.clientHeight < 130; }
function scrollToBottom(smooth){
  requestAnimationFrame(() => {
    D.messages.scrollTo({ top: D.messages.scrollHeight, behavior: smooth && !reduced ? 'smooth' : 'auto' });
    St.jumpCount = 0; D.jumpBtn.classList.add('hidden');
  });
}
function bumpJump(){
  St.jumpCount++;
  D.jumpText.textContent = St.jumpCount === 1 ? 'Latest message' : `${St.jumpCount} new messages`;
  D.jumpBtn.classList.remove('hidden');
}

/* ============================ ingest ============================ */
function normalize(d, hint){
  const from = pick(d, 'from','username','user','sender','author','name','who');
  const to = pick(d, 'to','recipient','target','peer');
  const text = pick(d, 'message','text','msg','body','content');
  const url = findUrl(d);
  const fname = pick(d, 'filename','file_name','fileName','original_name');
  const id = pick(d, 'id','message_id','mid');
  const flag = pick(d, 'is_image','isImage','inline','image');
  let kind = url ? 'file' : 'text';
  let body = text != null ? String(text) : '';
  let finalUrl = url, filename = fname != null ? String(fname) : (url ? baseName(url) : null);
  // A plain text message that is just an uploaded image link → render as media.
  if (!finalUrl && /^\/?uploads\/[^\s]+$/i.test(body.trim())) {
    const u = normalizeFileUrl(body.trim());
    if (u) { finalUrl = u; kind = 'file'; filename = baseName(u); }
  }
  if (kind === 'file' && !filename) filename = baseName(finalUrl);
  const isImage = kind === 'file' && !isSvg(filename) && (isRaster(filename) || flag === true || flag === 'true');
  return {
    kind, from: from != null ? String(from) : null, to: to != null ? String(to) : null,
    text: body, url: finalUrl, filename, isImage, id: id != null ? String(id) : null,
    ts: parseTs(pick(d, 'ts','time','timestamp','created_at','at','date')), hint
  };
}
function routeOf(m){
  const me = St.me && St.me.name;
  /* Private frames without an explicit recipient are addressed to us:
     route them to the sender's thread instead of dropping them in General. */
  if (m.hint === 'private') {
    if (m.from && m.from !== me) return { thread: 'pm:' + m.from, dm: true };
    if (m.from === me && !m.to) { const a = activeThread(); if (a.dm) return { thread: a.key, dm: true }; return null; }
  }
  const generic = !m.to || ['general','all','*','room',''].includes(String(m.to).toLowerCase());
  if (generic || m.hint === 'public') return { thread: 'general', dm: false };
  if (m.to === me || m.from === me) return { thread: 'pm:' + (m.from === me ? m.to : m.from), dm: true };
  return null;
}
function ingest(d, opts = {}){
  const m = normalize(d, opts.hint);
  if (!m.from) return;
  if (m.kind === 'text' && !m.text.trim()) return;
  const route = routeOf(m); if (!route) return;
  m.thread = route.thread; m.dm = route.dm; m.mine = m.from === (St.me && St.me.name);
  if (m.dm) { const t = thread(m.thread); if (t.status !== 'active') { t.status = 'active'; t.canceled = false; renderChatList(); if (St.active === t.key) { renderBanner(); syncComposer(); updateHeader(); } } }
  if (anySeen(m)) return;
  const t = thread(m.thread);
  // reconcile with an optimistic local copy
  let local = m.id != null ? St.pending.get(m.id) : null;
  if (!local && m.mine) local = t.msgs.slice(-14).find(x => x.local && x.status !== 'failed' &&
    (m.kind === 'file' ? canonUrl(x.url) === canonUrl(m.url) : (x.kind === 'text' && x.text === m.text)));
  if (local) {
    keysOf(m).forEach(markSeen);
    if (m.id != null) { local.id = m.id; St.pending.delete(m.id); }
    if (m.kind === 'file' && m.url) local.url = m.url;
    local.status = 'delivered'; local.local = false;
    if (local._media) local._media.classList.remove('uploading');
    if (local._ring) { local._ring.remove(); local._ring = null; }
    paintStatus(local); renderChatList();
    return;
  }
  keysOf(m).forEach(markSeen);
  m.status = m.mine ? 'delivered' : null;
  push(t, m, { notify: !opts.silent && !m.mine, animate: !opts.silent });
}
function push(t, m, o = {}){
  t.msgs.push(m);
  if (t.msgs.length > 500) { const old = t.msgs.shift(); if (old && old.localUrl) URL.revokeObjectURL(old.localUrl); if (old && old._node) old._node.remove(); }
  t.lastTs = Math.max(t.lastTs, m.ts);
  const isActive = St.active === t.key;
  if (isActive) {
    const stick = m.mine || atBottom();
    appendRow(m, o.animate !== false);
    if (stick) scrollToBottom(true); else if (m.kind !== 'system' && !m.mine) bumpJump();
  }
  if (!m.mine && m.kind !== 'system' && (!isActive || document.hidden)) { t.unread++; updateTitle(); }
  if (o.notify && m.kind !== 'system') Audio_.play('receive');
  renderChatList();
}
function systemNote(text, threadKey){
  const t = thread(threadKey || 'general');
  push(t, { kind: 'system', text: String(text), ts: Date.now(), from: 'system', thread: t.key, mine: false }, { animate: true });
}

/* ---- history sync: guarantees file delivery even if an SSE frame is missed ---- */
async function syncHistory(silent){
  if (St.syncing || !St.me) return;
  St.syncing = true;
  try {
    const r = await fetch('/api/history?limit=80', { cache: 'no-store' });
    if (r.ok) {
      const items = listOf(await r.json(), ['messages','history','items','entries']);
      const before = St.frames;
      items.forEach(raw => {
        const probe = normalize(raw, 'public');
        const fresh = probe.ts > Date.now() - 90000;
        ingest(raw, { silent: silent || !fresh, hint: 'public' });
      });
      St.lastSync = Date.now(); St.historyPrimed = true; void before;
    }
  } catch {}
  St.syncing = false;
}

/* ============================ SSE ============================ */
const EVENTS = ['message','chat','msg','say','broadcast','welcome','init','hello','ready','session','token','joined','join',
 'user_joined','userjoined','user_left','userleft','leave','part','online','offline','users','user_list','userlist','roster',
 'presence','history','backlog','file','files','upload','file_shared','fileshared','attachment','image','photo','media',
 /* the server's canonical (snake_case) private-chat event names: without
    these exact entries the browser drops every handshake frame silently */
 'private_chat_request','private_chat_response','private_chat_started','private_chat_declined',
 'private_chat_canceled','private_chat_ended',
 'private_request','private-request','privaterequest','request','private_response','private-response','privateresponse',
 'response','private_message','private-message','privatemessage','pm','dm','private','system','notice','info','server',
 'motd','error','ping','heartbeat','keepalive'];
function connect(){
  if (St.es) { St.es.close(); St.es = null; }
  if (!St.me) return;
  const es = new EventSource('/chat-stream?username=' + encodeURIComponent(St.me.name));
  St.es = es;
  EVENTS.forEach(n => es.addEventListener(n, ev => onFrame(n, ev.data)));
  es.onopen = () => { St.live = true; St.retry = 0; updateConnUI(); };
  es.onerror = () => {
    St.live = false; updateConnUI();
    if (St.joined) { if (es.readyState === EventSource.CLOSED) scheduleRetry(); }
    else if (++St.joinTries >= 2) joinFail('The server refused the connection. That name may still be in use — try another.');
  };
}
function scheduleRetry(){
  clearTimeout(St.retryTimer);
  if (!St.joined || !St.me) return;
  St.retry++; St.reconnects++; updateConnUI();
  const wait = Math.min(15000, 1000 * Math.pow(2, Math.min(St.retry - 1, 4)));
  St.retryTimer = setTimeout(connect, wait);
}
function reconnect(manual){
  clearTimeout(St.retryTimer);
  St.live = false; St.missStreak = 0;
  if (manual) { St.reconnects++; banner('Reconnecting', 'Opening a new event stream…', 'info'); }
  updateConnUI(); connect();
  setTimeout(() => syncHistory(true), 900);
}
function onFrame(name, raw){
  St.frames++;
  let d = null; try { d = JSON.parse(raw); } catch {}
  if (d === null || typeof d !== 'object') {
    const s = String(raw == null ? '' : raw).trim();
    if (/^(token|welcome|init|hello|session|joined|ready)$/i.test(name) && /^[\w.\-]{8,}$/.test(s)) return adopt(s);
    if (!s || /^(ping|heartbeat|keepalive)$/i.test(name)) return;
    return systemNote(s);
  }
  const type = String(d.type || d.event || name || '').toLowerCase().replace(/[-_\s]/g, '');
  const me = St.me && St.me.name;
  const who = pick(d, 'username','name','user','from');
  if (typeof d.token === 'string' && d.token && (!who || who === me || /^(welcome|init|hello|token|joined|session|ready)$/.test(type)))
    adopt(d.token, pick(d, 'username','name'));
  if (Array.isArray(d.users)) setPeople(namesFrom(d.users));
  if (Array.isArray(d.history)) d.history.forEach(x => ingest(x, { silent: true, hint: 'public' }));
  if (Array.isArray(d.messages) && /^(history|welcome|init|backlog|ready)$/.test(type)) d.messages.forEach(x => ingest(x, { silent: true, hint: 'public' }));

  if (/^(welcome|init|hello|session|joined|token|ready)$/.test(type)) { if (!d.token && who && who !== me) presence(who, true); return; }
  if (/^(users|userlist|roster|presence)$/.test(type)) { const l = listOf(d, ['list','online','people']); if (l.length) setPeople(namesFrom(l)); return; }
  if (/^(userjoined|join|online|userconnected)$/.test(type)) { presence(who, true); return; }
  if (/^(userleft|leave|part|offline|userdisconnected)$/.test(type)) { presence(who, false); return; }
  if (/^(history|backlog)$/.test(type)) { listOf(d, ['messages','items','entries']).forEach(x => ingest(x, { silent: true, hint: 'public' })); return; }
  if (/^(privaterequest|request|pmrequest|privatechatrequest)$/.test(type)) return onRequest(d);
  if (/^(privateresponse|response|pmresponse|privatechatresponse|privatechatstarted|privatechatdeclined)$/.test(type)) return onResponse(d);
  if (/^(privatechatcanceled|requestcanceled|cancelrequest)$/.test(type)) return onRequestCanceled(d);
  if (/^(privatechatended|chatended|privatechatclosed)$/.test(type)) return onPrivateEnded(d);
  if (/^(privatemessage|pm|dm|private|privatechat)$/.test(type)) return ingest(d, { hint: 'private' });
  if (/^(file|files|upload|fileshared|sharedfile|attachment|image|photo|media)$/.test(type)) { St.fileFrames++; return ingest(d, {}); }
  if (/^error$/.test(type)) {
    const msg = errText(d) || 'Stream error';
    banner('Error', msg, 'error');
    if (/token/i.test(msg)) signOut(true);
    return;
  }
  if (/^(system|notice|info|server|motd)$/.test(type)) { const t = pick(d, 'msg','message','text'); if (t) systemNote(t); return; }
  if (/^(ping|heartbeat|keepalive)$/.test(type)) return;
  if (/^(message|chat|msg|say|broadcast)$/.test(type)) return ingest(d, {});
  if (findUrl(d)) { St.fileFrames++; return ingest(d, {}); }
  if (typeof pick(d, 'message','text','msg') === 'string' && who) return ingest(d, {});
  if (typeof d.msg === 'string') systemNote(d.msg);
}
function presence(who, joined){
  if (!who || who === (St.me && St.me.name)) return;
  const n = String(who);
  if (joined) {
    if (!St.users.includes(n)) setPeople([...St.users, n]);
    systemNote(`${n} joined the chat`); Audio_.play('join');
  } else {
    if (St.users.includes(n)) setPeople(St.users.filter(x => x !== n));
    systemNote(`${n} left the chat`);
    const t = St.threads['pm:' + n];
    if (t && (t.status === 'pending' || t.status === 'incoming')) {
      t.status = 'closed'; t.canceled = true; t.rid = null;
      systemNote(`${n} went offline — the invitation was canceled.`, t.key);
      renderChatList();
      if (St.active === t.key) { renderBanner(); syncComposer(); updateHeader(); }
    } else if (t) systemNote(`${n} is offline`, t.key);
  }
}
function adopt(token, name){
  if (!St.me) return;
  St.me.token = String(token);
  if (typeof name === 'string' && name) St.me.name = name;
  if (!St.joined) { clearTimeout(St.joinTimer); localStorage.setItem('fwchat.name', St.me.name); enterApp(); }
}

/* ============================ private conversations ============================ */
async function api(path, body){
  let r, j = null;
  try { r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
  catch { throw Object.assign(new Error('Can’t reach the server.'), { status: 0 }); }
  try { j = await r.json(); } catch {}
  if (!r.ok) throw Object.assign(new Error(errText(j) || `Request failed (${r.status})`), { status: r.status });
  return j || {};
}
async function requestPrivate(name){
  if (!St.me || name === St.me.name) return;
  const t = thread('pm:' + name);
  if (t.status === 'active' || t.status === 'pending' || t.status === 'incoming') { openThread(t.key); return; }
  t.status = 'pending'; t.canceled = false; renderChatList(); openThread(t.key);
  try {
    const j = await api('/request-private-chat', { token: St.me.token, to: name });
    t.rid = j.request_id != null ? String(j.request_id) : null;
    /* The server withdraws any older invitation this user still had out —
       mirror that locally so no other thread stays "pending". */
    for (const k in St.threads) {
      const o = St.threads[k];
      if (o !== t && o.dm && o.status === 'pending') { o.status = 'closed'; o.rid = null; o.canceled = true; }
    }
    banner('Request sent', `Waiting for ${name} to accept.`, 'info');
  } catch (e) {
    t.status = 'closed'; t.rid = null; banner('Request failed', e.message, 'error');
    if (e.status === 401) signOut(true);
  }
  renderBanner(); syncComposer(); renderChatList(); updateHeader();
}
async function cancelRequest(name){
  if (!St.me) return;
  const t = thread('pm:' + name);
  if (t.status !== 'pending') return;
  const rid = t.rid;
  t.status = 'closed'; t.canceled = true; t.rid = null; t.respRid = null;
  systemNote(`You canceled your request to ${name}.`, t.key);
  renderBanner(); syncComposer(); renderChatList(); updateHeader();
  banner('Request canceled', 'You can send a new invitation anytime.', 'info');
  if (!rid || !St.me.token) return;
  /* Let the server drop the pending request. Try the dedicated endpoint
     first, then fall back to declining our own request. Local state is
     already cleared, so a server refusal here is not fatal. */
  try { await api('/cancel-private-chat', { token: St.me.token, request_id: rid }); }
  catch {
    try { await api('/respond-private-chat', { token: St.me.token, request_id: rid, response: 'decline' }); } catch {}
  }
}
function onRequest(d){
  const me = St.me && St.me.name;
  const rid = String(pick(d, 'request_id','rid','id') || '');
  const from = pick(d, 'from','username','user','name','requester');
  const to = pick(d, 'to','target','recipient');
  if (!from) return;
  if (from === me) {
    if (to) {
      const t = thread('pm:' + to);
      t.status = 'pending'; t.rid = rid || t.rid; t.canceled = false;
      renderChatList();
      if (St.active === t.key) { renderBanner(); syncComposer(); updateHeader(); }
    }
    return;
  }
  if (to && to !== me) return;
  const name = String(from), t = thread('pm:' + name);
  if (t.status === 'active') return;
  t.status = 'incoming'; t.rid = rid; t.canceled = false;
  renderChatList(); if (St.active === t.key) { renderBanner(); syncComposer(); updateHeader(); }
  if (rid && St.seenReq.has(rid)) return;
  if (rid) St.seenReq.add(rid);
  /* a newer invitation replaces any queued one from the same person */
  St.reqQueue = St.reqQueue.filter(r => r.name !== name);
  St.reqQueue.push({ name, rid }); Audio_.play('request'); drainRequests();
}
async function drainRequests(){
  if (St.reqBusy || !St.reqQueue.length || !D.alertHost.classList.contains('hidden')) return;
  St.reqBusy = true;
  const req = St.reqQueue.shift();
  St.alertReq = req;   /* marks which request the dialog on screen belongs to */
  const answer = await showAlert({
    title: `${req.name} wants to chat`,
    message: 'Start a private conversation? Only the two of you will receive these messages.',
    avatarName: req.name,
    actions: [{ title: 'Decline', style: 'cancel', value: false }, { title: 'Accept', style: 'default', value: true }]
  });
  St.alertReq = null;
  const t = thread('pm:' + req.name);
  if (t.status !== 'incoming') {   /* withdrawn while the dialog was up */
    St.reqBusy = false; setTimeout(drainRequests, 120); return;
  }
  await respond(req.name, req.rid, answer === true);
  St.reqBusy = false;
  setTimeout(drainRequests, 120);
}
async function respond(name, rid, accept){
  const t = thread('pm:' + name);
  if (!rid) { banner('Request expired', 'Ask for a new invitation.', 'warning'); t.status = 'closed'; t.rid = null;
    renderBanner(); renderChatList(); syncComposer(); updateHeader(); return; }
  try {
    await api('/respond-private-chat', { token: St.me.token, request_id: rid, response: accept ? 'accept' : 'decline' });
    t.status = accept ? 'active' : 'closed'; t.respRid = rid; t.rid = null; t.canceled = false;
    systemNote(accept ? `Private conversation with ${name} started` : `You declined ${name}’s request`, t.key);
    if (accept) { openThread(t.key); Audio_.play('receive'); }
    else { renderBanner(); syncComposer(); }
  } catch (e) {
    banner('Could not respond', e.message, 'error');
    t.status = 'closed'; t.rid = null;
    if (e.status === 401) signOut(true);
  }
  renderChatList(); renderBanner(); syncComposer(); updateHeader();
}
function onResponse(d){
  const me = St.me && St.me.name;
  const rid = String(pick(d, 'request_id','rid','id') || '');
  const from = pick(d, 'from','responder','username','name');
  const to = pick(d, 'to','requester','target');
  const ty = String(d.type || '').toLowerCase().replace(/[-_\s]/g, '');
  const raw = pick(d, 'response','answer','result','accepted','ok','status');
  let ok = raw != null ? /^(acc|yes|ok|true|allow)/i.test(String(raw)) : d.accepted === true;
  if (ty.endsWith('started')) ok = true;         /* private_chat_started → accepted */
  else if (ty.endsWith('declined')) ok = false;  /* private_chat_declined → declined */
  let peer = from === me ? to : from;
  if (!peer && rid) peer = Object.keys(St.threads).find(k => St.threads[k].rid === rid);
  if (!peer || peer === me) return;
  peer = String(peer).replace(/^pm:/, '');
  const t = thread('pm:' + peer);
  if ((rid && t.respRid === rid) || t.canceled) return;
  t.respRid = rid; t.status = ok ? 'active' : 'closed';
  t.canceled = false;
  systemNote(ok ? `${peer} accepted your request` : `${peer} declined your request`, t.key);
  if (St.active === t.key) { renderBanner(); syncComposer(); }
  renderChatList(); updateHeader();
  banner(ok ? 'Private chat ready' : 'Request declined', ok ? `You can now message ${peer} privately.` : `${peer} declined the invitation.`,
    ok ? 'success' : 'warning', ok ? { label: 'Open', run: () => openThread(t.key) } : null);
  Audio_.play(ok ? 'receive' : 'error');
}
/* The requester withdrew their invitation while it was still pending:
   close the incoming thread, drop any queued "wants to chat" dialog and
   take down the dialog currently on screen if it is the same request. */
function onRequestCanceled(d){
  const me = St.me && St.me.name;
  const rid = String(pick(d, 'request_id','rid','id') || '');
  const from = String(pick(d, 'from','user','name','username') || '');
  const to = pick(d, 'to','target');
  if (!from || from === me || (to && to !== me)) return;
  const t = thread('pm:' + from);
  if (t.status !== 'incoming' && t.status !== 'pending') return;
  if (rid && t.rid && t.rid !== rid) return;   /* a different (newer) invitation — keep it */
  const wasIncoming = t.status === 'incoming';
  t.status = 'closed'; t.rid = null; t.respRid = null; t.canceled = true;
  St.reqQueue = St.reqQueue.filter(r => r.name !== from || (rid && r.rid !== rid));
  if (St.alertReq && St.alertReq.name === from && !D.alertHost.classList.contains('hidden') &&
      (!rid || !St.alertReq.rid || St.alertReq.rid === rid)) {
    const r = alertResolve; closeAlert(); if (r) r(null);   /* dismiss the invitation dialog */
  }
  if (wasIncoming) {
    systemNote(`${from} canceled the private chat request.`, t.key);
    banner('Invitation canceled', `${from} withdrew the invitation.`, 'info');
  }
  renderChatList(); renderBanner(); syncComposer(); updateHeader();
}
/* The private conversation ended — the partner left the chat. */
function onPrivateEnded(d){
  const me = St.me && St.me.name;
  const who = String(pick(d, 'user','from','name') || '');
  if (!who || who === me) return;
  const t = thread('pm:' + who);
  if (t.status !== 'active') return;
  t.status = 'closed'; t.rid = null; t.respRid = null;
  systemNote(String(pick(d, 'message','msg','text') || (who + ' left the private chat')), t.key);
  renderChatList(); renderBanner(); syncComposer(); updateHeader();
}

/* ============================ threads / navigation ============================ */
function openThread(key){
  const t = thread(key);
  St.active = key; t.unread = 0;
  renderThread(); updateHeader(); renderBanner(); syncComposer(); renderChatList(); updateTitle();
  closeNav();
  if (!D.composerInput.disabled) D.composerInput.focus();
}
function updateHeader(){
  const t = activeThread();
  D.convTitle.textContent = t.name;
  D.convIcon.textContent = '';
  if (t.dm) {
    D.convIcon.appendChild(avatar(t.name, 's'));
    D.convIcon.style.background = 'transparent';
    const online = St.users.includes(t.name);
    D.convSub.textContent = t.status === 'active' ? (online ? 'Private · Online' : 'Private · Offline')
      : t.status === 'pending' ? 'Private · Request pending'
      : t.status === 'incoming' ? 'Private · Awaiting your reply' : 'Private · Not connected';
  } else {
    D.convIcon.style.background = '';
    D.convIcon.appendChild(icon('bubbles'));
    const n = St.users.length;
    D.convSub.textContent = `${n} ${n === 1 ? 'person' : 'people'} online`;
  }
}
function renderBanner(){
  const t = activeThread();
  D.convBanner.textContent = '';
  if (!t.dm || t.status === 'active') {
    D.convBanner.classList.add('hidden');
  } else {
    D.convBanner.classList.remove('hidden');
    D.convBanner.appendChild(icon(t.status === 'pending' ? 'clock' : 'lock'));
    const txt = el('span', 'txt');
    if (t.status === 'pending') txt.textContent = `Waiting for ${t.name} to accept your invitation.`;
    else if (t.status === 'incoming') txt.textContent = `${t.name} invited you to a private conversation.`;
    else txt.textContent = `You aren’t connected privately with ${t.name}.`;
    D.convBanner.appendChild(txt);
    if (t.status === 'incoming') {
      const no = el('button', 'btn sm secondary', 'Decline'); no.type = 'button'; no.onclick = () => respond(t.name, t.rid, false);
      const yes = el('button', 'btn sm', 'Accept'); yes.type = 'button'; yes.onclick = () => respond(t.name, t.rid, true);
      D.convBanner.appendChild(no); D.convBanner.appendChild(yes);
    } else if (t.status === 'pending') {
      const c = el('button', 'btn sm secondary', 'Cancel Request'); c.type = 'button'; c.onclick = () => cancelRequest(t.name);
      D.convBanner.appendChild(c);
    } else {
      const b = el('button', 'btn sm', 'Request'); b.type = 'button'; b.onclick = () => requestPrivate(t.name);
      D.convBanner.appendChild(b);
    }
  }
  /* keep the “latest messages” pill clear of the invitation bar */
  D.jumpBtn.style.bottom = D.convBanner.classList.contains('hidden') ? '' : (D.convBanner.offsetHeight + 104) + 'px';
}
function updateTitle(){
  let n = 0; for (const k in St.threads) n += St.threads[k].unread || 0;
  document.title = n ? `(${n}) fw Chat` : 'fw Chat';
}
function openNav(){ D.appView.classList.add('nav-open'); }
function closeNav(){ D.appView.classList.remove('nav-open'); }

/* ============================ composer ============================ */
function autosize(){ const i = D.composerInput; i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight, 132) + 'px'; }
function syncComposer(){
  const t = activeThread();
  const linkOk = !!(St.joined && St.me && St.me.token && St.live);
  const ok = linkOk && (!t.dm || t.status === 'active');
  D.composerInput.disabled = !ok;
  D.attachBtn.disabled = !linkOk;
  D.sendBtn.disabled = !(ok && D.composerInput.value.trim().length > 0);
  D.composerInput.placeholder = !St.joined ? 'Join to start messaging'
    : !St.live ? 'Reconnecting…'
    : t.dm ? (t.status === 'active' ? 'Private Message' : 'Private chat unavailable')
    : 'Message';
}
function sendText(){
  const text = D.composerInput.value.trim();
  if (!text || D.sendBtn.disabled) return;
  const t = activeThread();
  const m = { kind: 'text', text, from: St.me.name, to: t.dm ? t.name : null, thread: t.key, dm: t.dm,
    mine: true, ts: Date.now(), id: null, status: 'sending', local: true };
  push(t, m, { animate: true });
  D.composerInput.value = ''; autosize(); syncComposer(); Audio_.play('sent');
  deliverText(m);
  D.composerInput.focus();
}
async function deliverText(m){
  m.status = 'sending'; paintStatus(m);
  try {
    const j = m.dm ? await api('/send-private', { token: St.me.token, to: m.to, message: m.text })
                   : await api('/send', { token: St.me.token, message: m.text });
    if (j.id != null) { m.id = String(j.id); St.pending.set(m.id, m); }
    m.status = 'sent'; paintStatus(m);
    setTimeout(() => { if (m.status === 'sent') syncHistory(true); }, 1200);
  } catch (e) {
    m.status = 'failed'; paintStatus(m);
    banner('Message not delivered', e.message, 'error');
    if (e.status === 401) signOut(true);
    else if (m.dm && [403, 404, 409].includes(e.status)) { const t = thread(m.thread); t.status = 'closed'; renderBanner(); syncComposer(); renderChatList(); }
  }
}
function retry(m){
  if (m.kind === 'file' && m.file) return uploadInto(m, m.file);
  if (m.kind === 'file') return;
  deliverText(m);
}

/* ============================ uploads ============================ */
function pickFiles(files){
  if (!St.me || !St.me.token) { banner('Join first', 'Choose a name before sending files.', 'warning'); return; }
  const list = Array.from(files).slice(0, 6);
  if (!list.length) return;
  if (St.active !== 'general') { openThread('general'); banner('Shared in General', 'Files are broadcast to everyone.', 'info'); }
  list.forEach(f => {
    if (!f.size) { banner('Empty file', f.name, 'warning'); return; }
    if (f.size > MAX_UP) { banner('File too large', `${f.name} exceeds the 50 MB limit.`, 'error'); return; }
    const t = thread('general');
    const m = { kind: 'file', file: f, filename: f.name, isImage: /^image\//.test(f.type) && !isSvg(f.name) || isRaster(f.name),
      url: null, localUrl: /^image\//.test(f.type) && !isSvg(f.name) ? URL.createObjectURL(f) : null,
      from: St.me.name, to: null, thread: 'general', dm: false, mine: true, ts: Date.now(),
      status: 'uploading', progress: 0, local: true };
    if (!m.isImage && m.localUrl) { URL.revokeObjectURL(m.localUrl); m.localUrl = null; }
    push(t, m, { animate: true });
    uploadInto(m, f);
  });
}
function uploadInto(m, file){
  m.status = 'uploading'; m.progress = 0; paintStatus(m);
  if (m._media) m._media.classList.add('uploading');
  const xhr = new XMLHttpRequest();
  m._xhr = xhr;
  xhr.open('POST', '/chat/upload');
  xhr.timeout = 180000;
  const fd = new FormData();
  fd.append('token', St.me.token);
  fd.append('file', file, file.name);
  xhr.upload.onprogress = e => { if (e.lengthComputable) { setProgress(m, e.loaded / e.total); paintStatus(m); } };
  xhr.onload = () => {
    let j = null; try { j = JSON.parse(xhr.responseText); } catch {}
    const url = j ? normalizeFileUrl(j.url) : null;
    if (xhr.status === 200 && url) {
      m.url = url; m.status = 'sent'; m.local = true;
      keysOf(m).forEach(markSeen);
      if (m._media) m._media.classList.remove('uploading');
      if (m._ring) { m._ring.remove(); m._ring = null; }
      if (m._img && !m.localUrl) m._img.src = url;
      if (m._fileSub) m._fileSub.textContent = isSvg(m.filename) ? 'SVG image' : 'File';
      if (m._node && !m._node.querySelector('.file-dl') && m._node.querySelector('.file-card')) {
        const a = el('a', 'file-dl'); a.href = dlHref(url); a.setAttribute('download', ''); a.appendChild(icon('download'));
        m._node.querySelector('.file-card').appendChild(a);
      }
      paintStatus(m); renderChatList(); Audio_.play('sent');
      confirmDelivery(m);
    } else {
      m.status = 'failed'; paintStatus(m);
      if (m._media) m._media.classList.remove('uploading');
      if (m._ring) { m._ring.remove(); m._ring = null; }
      banner('Upload failed', errText(j) || `Server returned ${xhr.status}.`, 'error');
      if (xhr.status === 401) signOut(true);
    }
    m._xhr = null;
  };
  const fail = msg => {
    m.status = 'failed'; paintStatus(m); m._xhr = null;
    if (m._media) m._media.classList.remove('uploading');
    if (m._ring) { m._ring.remove(); m._ring = null; }
    banner('Upload failed', msg, 'error');
  };
  xhr.onerror = () => fail('Network error while uploading.');
  xhr.ontimeout = () => fail('The upload timed out.');
  xhr.onabort = () => fail('Upload canceled.');
  xhr.send(fd);
}
/* Verify the file actually reached other clients. If the hub's file frame or
   history record never shows up, relay the URL as a normal message so every
   client still renders the image. */
function confirmDelivery(m){
  let checks = 0;
  const tick = () => {
    checks++;
    syncHistory(true).then(() => {
      if (m.status === 'delivered') return;
      if (checks >= 2) {
        if (m.status !== 'failed' && m.url && !m.relayed) {
          m.relayed = true;
          api('/send', { token: St.me.token, message: m.url })
            .then(() => { m.status = 'delivered'; paintStatus(m); })
            .catch(() => { m.status = 'sent'; paintStatus(m); });
        }
        return;
      }
      setTimeout(tick, 1600);
    });
  };
  setTimeout(tick, 1400);
}

/* ============================ viewer ============================ */
function openViewer(m, src){
  St.viewerMsg = m;
  D.viewerImg.src = src || m.localUrl || m.url;
  D.viewerImg.alt = m.filename || 'Photo';
  D.viewerImg.classList.remove('zoomed');
  D.viewerBody.classList.remove('zoom-scroll');
  D.viewerName.textContent = m.filename || baseName(m.url);
  D.viewer.classList.remove('hidden');
  D.viewerClose.focus();
}
function closeViewer(){ D.viewer.classList.add('hidden'); D.viewerImg.src = ''; St.viewerMsg = null; }

/* ============================ join / leave ============================ */
function joinError(msg){
  D.joinError.textContent = '';
  D.joinError.appendChild(icon('alert'));
  D.joinError.appendChild(el('span', null, msg));
  D.joinError.classList.remove('hidden');
}
function joinFail(msg){
  if (St.joined) return;
  clearTimeout(St.joinTimer);
  if (St.es) { St.es.close(); St.es = null; }
  St.me = null; St.joinBusy = false; St.live = false;
  D.joinBtn.disabled = false; D.joinBtn.textContent = 'Continue';
  joinError(msg); updateConnUI();
}
async function join(){
  if (St.joinBusy) return;
  const name = D.joinName.value.trim().replace(/\s+/g, ' ');
  if (!/^[A-Za-z0-9_][A-Za-z0-9_.\- ]{1,23}$/.test(name)) return joinError('Use 2–24 characters: letters, numbers, spaces, dot, dash or underscore.');
  D.joinError.classList.add('hidden');
  St.joinBusy = true; D.joinBtn.disabled = true; D.joinBtn.textContent = 'Connecting…';
  try {
    const list = await getPeople(); setPeople(list);
    if (list.some(n => n.toLowerCase() === name.toLowerCase())) {
      St.joinBusy = false; D.joinBtn.disabled = false; D.joinBtn.textContent = 'Continue';
      return joinError(`“${name}” is already in use. Please choose another name.`);
    }
  } catch {
    St.joinBusy = false; D.joinBtn.disabled = false; D.joinBtn.textContent = 'Continue';
    return joinError('Can’t reach the server. Make sure fw is running.');
  }
  St.me = { name, token: null }; St.joinTries = 0;
  Audio_.init(); connect();
  clearTimeout(St.joinTimer);
  St.joinTimer = setTimeout(() => { if (!St.joined) joinFail('The server didn’t respond in time. Please try again.'); }, 10000);
}
async function enterApp(){
  St.joined = true; St.live = true; St.joinedAt = Date.now(); St.joinBusy = false;
  D.joinView.classList.add('hidden');
  D.appView.classList.remove('hidden');
  D.selfAvatar.textContent = ''; D.selfAvatar.appendChild(avatar(St.me.name));
  D.selfName.textContent = St.me.name;
  updateConnUI(); renderPeople();
  openThread('general');
  if (!St.welcomed) {
    St.welcomed = true;
    systemNote(`You joined as ${St.me.name}`);
  }
  await syncHistory(true);
  loadInfo(); pollPeople();
  syncComposer(); updateTitle();
  D.composerInput.focus();
}
function signOut(expired){
  clearTimeout(St.joinTimer); clearTimeout(St.retryTimer);
  if (St.es) { St.es.close(); St.es = null; }
  const last = St.me ? St.me.name : localStorage.getItem('fwchat.name') || '';
  Object.values(St.threads).forEach(t => t.msgs.forEach(m => m.localUrl && URL.revokeObjectURL(m.localUrl)));
  St.me = null; St.joined = false; St.live = false; St.welcomed = false; St.retry = 0; St.retryTimer = 0;
  St.threads = {}; thread('general'); St.active = 'general';
  St.seen.clear(); St.seenQ = []; St.pending.clear(); St.historyPrimed = false; St.lastSync = 0;
  St.reqQueue = []; St.reqBusy = false; St.seenReq.clear(); St.frames = 0; St.fileFrames = 0; St.reconnects = 0;
  closeAlert(); closeSheet(); closeMenu(); closeInfo(); closeViewer(); closeNav();
  D.appView.classList.add('hidden');
  D.joinView.classList.remove('hidden');
  D.joinName.value = last;
  D.joinBtn.disabled = false; D.joinBtn.textContent = 'Continue';
  D.composerInput.value = ''; autosize();
  updateConnUI(); renderJoinPeople(); updateTitle();
  if (expired) joinError('Your session expired. Please join again.');
  D.joinName.focus();
}

/* ============================ events ============================ */
function bind(){
  D.joinBtn.onclick = join;
  D.joinName.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); join(); } });
  D.joinName.addEventListener('input', () => D.joinError.classList.add('hidden'));

  D.navBtn.onclick = () => { if (innerWidth <= 900) openNav(); else D.appView.classList.toggle('collapsed'); };
  D.collapseBtn.onclick = () => { if (innerWidth <= 900) closeNav(); else D.appView.classList.add('collapsed'); };
  D.scrim.onclick = closeNav;
  D.leaveBtn.onclick = async () => {
    const yes = await showAlert({ title: 'Sign out of fw Chat?', message: 'You’ll leave the chat and your name will be released.',
      actions: [{ title: 'Cancel', style: 'cancel', value: false }, { title: 'Sign Out', style: 'destructive', value: true }] });
    if (yes) signOut(false);
  };
  D.infoBtn.onclick = openInfo; D.infoBtn2.onclick = openInfo;
  D.soundBtn.onclick = () => {
    St.sound = !St.sound; localStorage.setItem('fwchat.sound', St.sound ? '1' : '0');
    syncSound(); if (St.sound) { Audio_.init(); Audio_.play('receive'); }
    banner(St.sound ? 'Sounds on' : 'Sounds off', null, 'info');
  };
  D.themeBtn.onclick = () => {
    St.theme = St.theme === 'auto' ? 'light' : St.theme === 'light' ? 'dark' : 'auto';
    localStorage.setItem('fwchat.theme', St.theme); applyTheme();
    banner('Appearance', St.theme === 'auto' ? 'Matching your system setting.' : St.theme === 'light' ? 'Light mode.' : 'Dark mode.', 'info');
  };

  D.searchInput.addEventListener('input', () => {
    St.query = D.searchInput.value.trim().toLowerCase();
    D.searchClear.classList.toggle('hidden', !St.query);
    renderChatList(); renderPeople();
  });
  D.searchClear.onclick = () => { D.searchInput.value = ''; St.query = ''; D.searchClear.classList.add('hidden'); renderChatList(); renderPeople(); D.searchInput.focus(); };

  D.sendBtn.onclick = sendText;
  D.composerInput.addEventListener('input', () => { autosize(); syncComposer(); });
  D.composerInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendText(); }
  });
  D.composerInput.addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items; if (!items) return;
    const files = [];
    for (const it of items) if (it.kind === 'file') { const f = it.getAsFile(); if (f) files.push(f); }
    if (files.length) { e.preventDefault(); pickFiles(files); }
  });
  D.attachBtn.onclick = () => D.fileInput.click();
  D.fileInput.addEventListener('change', () => { pickFiles(D.fileInput.files); D.fileInput.value = ''; });

  let ticking = false;
  D.messages.addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => { ticking = false; if (atBottom()) { St.jumpCount = 0; D.jumpBtn.classList.add('hidden'); } });
  });
  D.jumpBtn.onclick = () => scrollToBottom(true);

  D.viewerClose.onclick = closeViewer;
  D.viewerSave.onclick = () => {
    const m = St.viewerMsg; if (!m || !m.url) return;
    const a = el('a'); a.href = dlHref(m.url); a.setAttribute('download', '');
    document.body.appendChild(a); a.click(); a.remove();
  };
  D.viewerImg.onclick = () => {
    const z = D.viewerImg.classList.toggle('zoomed');
    D.viewerBody.classList.toggle('zoom-scroll', z);
  };
  D.alertHost.addEventListener('click', e => { if (e.target === D.alertHost && alertResolve) { const r = alertResolve; closeAlert(); r(false); } });
  D.sheetHost.addEventListener('click', e => { if (e.target === D.sheetHost) closeSheet(); });
  D.infoHost.addEventListener('click', e => { if (e.target === D.infoHost) closeInfo(); });

  document.addEventListener('click', e => {
    if (!D.menuHost.classList.contains('hidden') && !D.menuHost.contains(e.target) && !(St.menuAnchor && St.menuAnchor.contains(e.target))) closeMenu();
  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (St.joined) { if (innerWidth <= 900) openNav(); D.searchInput.focus(); D.searchInput.select(); } return; }
    if (e.key !== 'Escape') return;
    if (!D.viewer.classList.contains('hidden')) return closeViewer();
    if (!D.infoHost.classList.contains('hidden')) return closeInfo();
    if (!D.sheetHost.classList.contains('hidden')) return closeSheet();
    if (!D.menuHost.classList.contains('hidden')) return closeMenu();
    if (!D.alertHost.classList.contains('hidden')) { if (alertResolve) { const r = alertResolve; closeAlert(); r(false); } return; }
    if (D.appView.classList.contains('nav-open')) return closeNav();
  });

  const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragenter', e => { if (!St.joined || !hasFiles(e)) return; e.preventDefault(); St.dragDepth++; D.dropHint.classList.remove('hidden'); });
  window.addEventListener('dragover', e => { if (St.joined && hasFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', () => { if (--St.dragDepth <= 0) { St.dragDepth = 0; D.dropHint.classList.add('hidden'); } });
  window.addEventListener('drop', e => {
    if (!St.joined) return; e.preventDefault(); St.dragDepth = 0; D.dropHint.classList.add('hidden');
    if (e.dataTransfer && e.dataTransfer.files.length) pickFiles(e.dataTransfer.files);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (Audio_.ctx && Audio_.ctx.resume) Audio_.ctx.resume();
    loadInfo(); pollPeople(); syncHistory(true);
    if (St.joined) {
      activeThread().unread = 0; updateTitle(); renderChatList();
      if (St.es && St.es.readyState === EventSource.CLOSED) reconnect();
    }
  });
  window.addEventListener('resize', () => { closeMenu(); if (innerWidth > 900) closeNav(); });
  window.addEventListener('beforeunload', () => { if (St.es) St.es.close(); });
}

/* ============================ boot ============================ */
applyTheme(); syncSound(); bind(); autosize();
D.joinName.value = localStorage.getItem('fwchat.name') || '';
updateConnUI(); renderJoinPeople(); renderChatList();
loadInfo(); pollPeople();
setInterval(pollPeople, 9000);
setInterval(loadInfo, 30000);
setInterval(() => { if (St.joined && St.live) syncHistory(false); }, 5000);
})();
</script>
